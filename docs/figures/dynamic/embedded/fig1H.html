<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fig. 1H — Macrophage tracking · macrohet</title>
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: transparent;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      overflow: hidden; /* no scroll inside iframe */
    }

    #plot-1H {
      width: 100%;
      height: 100vh;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      letter-spacing: 0.06em;
      color: #aaa;
      background: transparent;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    #loading.hidden { opacity: 0; }

    /* Image hover tooltip — same logic as interactivity.js */
    #hover-tooltip {
      position: fixed;
      display: none;
      z-index: 9999;
      background: white;
      border: 2px solid #fff;
      padding: 5px;
      border-radius: 4px;
      pointer-events: none;
      box-shadow: 0 4px 6px rgba(113,113,113,0.3);
    }
  </style>
</head>
<body>

  <div id="loading">loading figure…</div>
  <div id="plot-1H"></div>
  <div id="hover-tooltip"></div>

  <script>
    fetch('../F1H_plot_data.json')
      .then(r => r.ok ? r.json() : Promise.reject(r.status))
      .then(data => {
        if (data.layout) {
          delete data.layout.width;
          delete data.layout.height;
        }

        data.data.forEach(trace => {
          if (trace.line) trace.line.width = 0.5;
        });

        const layout = {
          ...data.layout,
          autosize: true,
          font: {
            family: '"Helvetica Neue", Helvetica, Arial, sans-serif',
            size: 13,
            color: '#333'
          },
          legend: {
            ...(data.layout.legend || {}),
            itemclick: 'toggle',
            itemdoubleclick: 'toggleothers'
          },
          paper_bgcolor: 'rgba(0,0,0,0)',
          plot_bgcolor:  'rgba(0,0,0,0)'
        };

        return Plotly.newPlot('plot-1H', data.data, layout, {
          responsive: true,
          displayModeBar: false
        });
      })
      .then(plotDiv => {
        Plotly.Plots.resize(plotDiv);
        document.getElementById('loading').classList.add('hidden');

        // Image-hover tooltip (mirrors interactivity.js logic)
        const tooltip = document.getElementById('hover-tooltip');

        plotDiv.on('plotly_hover', function(data) {
          let imgPath = Array.isArray(data.points[0].customdata)
            ? data.points[0].customdata[0]
            : data.points[0].customdata;

          if (!imgPath || imgPath === 'nan') return;

          if (!imgPath.startsWith('http') && !imgPath.startsWith('/') && !imgPath.includes('assets/')) {
            imgPath = `assets/${imgPath}`;
          }

          tooltip.innerHTML = `<img src="${imgPath}" style="max-width:300px; display:block;">`;
          tooltip.style.display = 'block';

          let x = data.event.clientX - tooltip.offsetWidth - 20;
          if (x < 0) x = data.event.clientX + 20;
          tooltip.style.left  = x + 'px';
          tooltip.style.top   = (data.event.clientY - 100) + 'px';
        });

        plotDiv.on('plotly_unhover', () => {
          tooltip.style.display = 'none';
        });

        document.addEventListener('mousemove', e => {
          if (tooltip.style.display === 'block') {
            let x = e.clientX - tooltip.offsetWidth - 20;
            if (x < 0) x = e.clientX + 20;
            tooltip.style.left = x + 'px';
            tooltip.style.top  = (e.clientY - 100) + 'px';
          }
        });
      })
      .catch(err => {
        document.getElementById('loading').textContent = 'figure unavailable';
        console.error('Fig 1H load error:', err);
      });
  </script>

</body>
</html>
