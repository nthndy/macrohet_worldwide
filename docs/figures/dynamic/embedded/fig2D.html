<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fig. 2D — Macrophage tracking · macrohet</title>
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: transparent;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      letter-spacing: 0.06em;
      color: #aaa;
      background: transparent;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    #loading.hidden { opacity: 0; }

    #hover-tooltip {
      position: fixed;
      display: none;
      z-index: 9999;
      background: white;
      border: 2px solid #fff;
      padding: 5px;
      border-radius: 4px;
      pointer-events: none;
      box-shadow: 0 4px 6px rgba(113,113,113,0.3);
    }

    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    #plot-2D {
      width: 100%;
      height: 100%;
      position: absolute;
      inset: 0;
    }

    body.dark { background: #111110; color: #e8e8e2; }
    body.dark #loading { color: #6a6a62; }
  </style>
</head>
<body>

  <div id="loading">loading figure…</div>
  <div id="plot-2D"></div>
  <div id="hover-tooltip"></div>

  <script>
    const theme = new URLSearchParams(window.location.search).get('theme');
    if (theme === 'dark') document.body.classList.add('dark');
  </script>

  <script>
    fetch('../F2D_plot_data.json')
      .then(r => r.ok ? r.json() : Promise.reject(r.status))
      .then(data => {
        if (data.layout) {
          delete data.layout.width;
          delete data.layout.height;
          if (data.layout.annotations) {
            data.layout.annotations = data.layout.annotations.filter(a =>
              !(a.showarrow === false && a.opacity && a.opacity < 0.3)
            );
          }
        }

        data.data.forEach(trace => {
          if (trace.line) trace.line.width = 0.5;
        });

        const isDark = document.body.classList.contains('dark');

        const layout = {
          ...data.layout,
          autosize: true,
          font: {
            family: '"Helvetica Neue", Helvetica, Arial, sans-serif',
            size: 13,
            color: isDark ? '#e8e8e2' : '#333'
          },
          xaxis: {
            ...data.layout.xaxis,
            color: isDark ? '#ffffff' : '#333',
            gridcolor: isDark ? '#2e2e2a' : '#e8e8e2',
            linecolor: isDark ? '#2e2e2a' : '#d1d1ca',
          },
          yaxis: {
            ...data.layout.yaxis,
            color: isDark ? '#ffffff' : '#333',
            gridcolor: isDark ? '#2e2e2a' : '#e8e8e2',
            linecolor: isDark ? '#2e2e2a' : '#d1d1ca',
          },
          legend: {
            ...(data.layout.legend || {}),
            itemclick: 'toggle',
            itemdoubleclick: 'toggleothers'
          },
          paper_bgcolor: 'rgba(0,0,0,0)',
          plot_bgcolor:  'rgba(0,0,0,0)'
        };

        return Plotly.newPlot('plot-2D', data.data, layout, {
          responsive: true,
          displayModeBar: false
        });
      })
      .then(plotDiv => {
        setTimeout(() => Plotly.Plots.resize(plotDiv), 100);
        document.getElementById('loading').classList.add('hidden');
        window.parent.postMessage({ type: 'plotReady' }, '*');

        const tooltip = document.getElementById('hover-tooltip');

        plotDiv.on('plotly_hover', function(data) {
          let imgPath = Array.isArray(data.points[0].customdata)
            ? data.points[0].customdata[0]
            : data.points[0].customdata;

          if (!imgPath || imgPath === 'nan') return;

          const BASE = 'https://nthndy.github.io/macrohet_worldwide/figures/dynamic/embedded/';

          if (!imgPath.startsWith('http')) {
            imgPath = BASE + (imgPath.includes('assets/') ? imgPath : `assets/${imgPath}`);
          }

          tooltip.innerHTML = `<video src="${imgPath}" style="max-width:480px; display:block;" autoplay muted loop playsinline></video>`;
          tooltip.style.display = 'block';

          let x = data.event.clientX - tooltip.offsetWidth - 20;
          if (x < 0) x = data.event.clientX + 20;
          tooltip.style.left  = x + 'px';
          tooltip.style.top   = (data.event.clientY - 100) + 'px';
        });

        plotDiv.on('plotly_unhover', () => {
          tooltip.style.display = 'none';
        });

        document.addEventListener('mousemove', e => {
          if (tooltip.style.display === 'block') {
            let x = e.clientX - tooltip.offsetWidth - 20;
            if (x < 0) x = e.clientX + 20;
            tooltip.style.left = x + 'px';
            tooltip.style.top  = (e.clientY - 100) + 'px';
          }
        });
      })
      .catch(err => {
        document.getElementById('loading').textContent = 'figure unavailable';
        console.error('Fig 2D load error:', err);
      });
  </script>

</body>
</html>
